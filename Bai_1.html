    <h1 align="center">CÔ HÁI MƠ</h1>
    <p><i>Thơ thẫn đường chiều một khách thơ,<br>
        Say nhìn xa rặng núi xanh lơ,</i><br>
        Khi trời lặng lẽ và trong trẻo<br>
        Thấp thoáng rằng mơ, <b>Cô hái mơ.</b><br>
        <u>Tác giả</u>: <s><i>Vô danh</i></s><p>
