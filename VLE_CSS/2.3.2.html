<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu ngang hai cấp</title>
<style>
  body { font-family: "Times New Roman", serif; }
  .menu_ngang {
    width: 960px;
    height: 50px;
    background-color: #CCC;
  }
  .menu_ngang ul {
    margin: 0;
    padding: 0;
    list-style: none;
    float: left;
  }
  .menu_ngang ul li {
    float: left;
    position: relative;
  }
  .menu_ngang ul li a {
    text-decoration: none;
    color: #333;
    line-height: 50px;
    border-right: 1px solid #666;
    display: block;
    padding: 0 20px;
    font-size: 14px;
  }
  .menu_ngang ul li a:hover {
    background: #444;
    color: #FFF;
  }

  .menu_ngang ul li ul {
    display: none;
    position: absolute;
    top: 50px;
    left: 0;
    float: none;
    width: 160px;
  }
  .menu_ngang ul li:hover > ul {
    display: block;
  }
  .menu_ngang ul li ul li {
    float: none;
    background: #CCC;
    border-bottom: 1px solid #FFF;
  }
  .menu_ngang ul li ul li a {
    line-height: 30px;
    border-right: none;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="menu_ngang">
    <ul>
      <li><a href="#">Trang chủ</a></li>
      <li><a href="#">Giới thiệu</a></li>
      <li><a href="#">Sản phẩm</a>
        <ul>
          <li><a href="#">Tivi</a></li>
          <li><a href="#">Tủ lạnh</a></li>
          <li><a href="#">Laptop</a></li>
          <li><a href="#">Máy tính bảng</a></li>
          <li><a href="#">Điện thoại</a></li>
        </ul>
      </li>
      <li><a href="#">Dịch vụ</a></li>
      <li><a href="#">Tin tức</a></li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
  </div>
</body>
</html>
