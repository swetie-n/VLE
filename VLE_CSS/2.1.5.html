<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Rectangles</title>
<style>
  body { font-family: "Times New Roman", serif; }
  .outside {
    border: 5px dotted blue;
    border-radius: 20px;
    padding: 30px;
    width: 400px;
  }
  .middle {
    border: 2px dashed red;
    border-radius: 15px;
    padding: 30px;
  }
  .inner {
    border: 3px solid green;
    border-radius: 5px;
    padding: 30px 20px;
    text-align: center;
    font-size: 28px;
  }
</style>
</head>
<body>
  <div class="outside">
    <div class="middle">
      <div class="inner">
        I am heavily packed<br>&lt;DIV&gt;
      </div>
    </div>
  </div>
</body>
</html>
