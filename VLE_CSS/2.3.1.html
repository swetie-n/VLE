<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu ngang một cấp</title>
<style>
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
  .menu {
    width: 1200px;
    height: 40px;
    margin: auto;
    background: linear-gradient(#DDD, #888);
  }
  .menu ul {
    padding: 0;
    margin: 0;
    list-style: none;
  }
  .menu ul li {
    float: left;
  }
  .menu ul li a {
    text-decoration: none;
    display: block;
    padding: 0 20px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    line-height: 40px;
    color: #000;
  }
  .menu ul li a:hover,
  .menu ul li a.active {
    background: #333;
    color: #FFF;
  }
</style>
</head>
<body>
  <div class="menu">
    <ul>
      <li><a href="#" class="active">Trang chủ</a></li>
      <li><a href="#">Giới thiệu</a></li>
      <li><a href="#">Dự án</a></li>
      <li><a href="#">Sản phẩm</a></li>
      <li><a href="#">Dịch vụ</a></li>
      <li><a href="#">Tin tức</a></li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
  </div>
</body>
</html>
