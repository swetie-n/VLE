<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra năm nhuận</title>
</head>
<body>
<h2>Kiểm tra năm nhuận</h2>
<script>
  let year = parseInt(prompt("Nhập vào năm cần kiểm tra:"));

  let isLeapYear = false;

  if (year % 400 == 0) {
    isLeapYear = true;
  } else {
    if (year % 4 == 0 && year % 100 != 0) {
      isLeapYear = true;
    } else {
      isLeapYear = false;
    }
  }

  if (isNaN(year)) {
    document.write("Năm nhập vào không hợp lệ!");
  } else if (isLeapYear) {
    document.write("<h3>Năm " + year + " là năm nhuận.</h3>");
  } else {
    document.write("<h3>Năm " + year + " KHÔNG PHẢI là năm nhuận.</h3>");
  }
</script>
</body>
</html>
